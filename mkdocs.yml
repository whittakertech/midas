site_name: WhittakerTech Midas
site_url: https://midas.whittakertech.com
repo_url: https://github.com/WhittakerTech/midas
repo_name: WhittakerTech/midas

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - codehilite
  - sane_lists
  - toc:
      permalink: true
  - tables
  - pymdownx.superfences

validation:
  nav:
    omitted_files: ignore

nav:
  - Introduction: index.md
  - Installation: installation.md
  - Usage: usage.md
  - Architecture: architecture.md
  - API Reference:
    - Overview: api.md
    - WhittakerTech::Midas:
      - Root Module: api/WhittakerTech/Midas.md
      - Bankable: api/WhittakerTech/Midas/Bankable.md
      - Coin:
        - Root Model: api/WhittakerTech/Midas/Coin.md
        - Allocation: api/WhittakerTech/Midas/Coin/Allocation.md
        - Arithmetic: api/WhittakerTech/Midas/Coin/Arithmetic.md
        - Bidi: api/WhittakerTech/Midas/Coin/Bidi.md
        - Converter: api/WhittakerTech/Midas/Coin/Converter.md
        - Parser: api/WhittakerTech/Midas/Coin/Parser.md
        - Presenter: api/WhittakerTech/Midas/Coin/Presenter.md
      - Engine: api/WhittakerTech/Midas/Engine.md
  - Examples: examples.md
  - Changelog: changelog.md

# NOTE: YARD-generated API files may be produced under docs/api/ during CI.
