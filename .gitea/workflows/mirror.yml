name: Mirror to GitHub

# Gitea is the workshop; GitHub is the storefront. Only master and tags ever
# reach GitHub — never tea or claude/* branches (per meta/branch-vocabulary.md).
# Runs after every push to master (i.e. after every "Publish" run) and on
# every version tag.
#
# Gitea-side operation by nature (pushes FROM this Gitea repo TO GitHub) --
# lives in .gitea/workflows/ for the same reason as publish.yml/ci.yml here:
# Gitea reads .gitea/workflows/ exclusively once it exists.

on:
  push:
    branches: ["master"]
    tags: ["v*.*.*"]

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # On a tag-triggered run actions/checkout leaves the workspace on a
      # detached HEAD at the tag, so no local refs/heads/master exists and
      # pushing it fails with "src refspec refs/heads/master does not match
      # any". Fetch the branches into remote-tracking refs, which are present
      # in both the branch and tag contexts, and push from those instead.
      # (Poly hit exactly this on its 1.3.0 release -- see Poly RM-206.)
      - name: Fetch all branches and tags
        run: git fetch --prune --tags --force origin "+refs/heads/*:refs/remotes/origin/*"

      - name: Push master + tags to GitHub mirror
        run: |
          git push --force "https://x-access-token:${WHITTAKER_TECH_GITHUB_KEY}@github.com/whittakertech/${{ github.event.repository.name }}.git" \
            "refs/remotes/origin/master:refs/heads/master" \
            "refs/tags/*:refs/tags/*"
        env:
          WHITTAKER_TECH_GITHUB_KEY: ${{ secrets.WHITTAKER_TECH_GITHUB_KEY }}
