name: CI/CD

# GitHub-only by construction, not by `if:` guard -- Gitea never reads this
# directory once .gitea/workflows/ exists (confirmed: go-gitea/gitea#31456),
# so it never attempts, and fails, the cross-repo `uses:` resolution below.
# That silent resolution failure (Gitea tries to resolve whittakertech/.github
# against itself and fails, at run-creation time -- before any job-level
# `if:` is even evaluated) was blocking every Actions run for this repo,
# not just this job, with zero error output. See .gitea/workflows/ci.yml
# for the real Gitea-side test/lint job.

on:
  push:
    branches: [ "master" ]
    tags:
      - "v*.*.*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  pipeline:
    uses: whittakertech/.github/.github/workflows/master-ci.yml@main
    with:
      docs_enabled: false
    secrets: inherit
