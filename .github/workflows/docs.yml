name: Docs (Codex publish)

# Real publish target: Codex ingests docs/ (hand-written pages +
# a freshly-regenerated YARD artifact, overlaid into docs/api/) and
# deploys straight to this repo's own gh-pages -- midas.whittakertech.com.
#
# GitHub-only by construction, not by `if:` guard: this file lives in
# .github/workflows/ specifically because Gitea never reads that directory
# once .gitea/workflows/ exists (see .gitea/workflows/docs.yml's comment)
# -- so Gitea never attempts, and fails, the cross-repo `uses:` resolution
# below.

on:
  push:
    branches: [main, master]

jobs:
  build-docs-artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: false

      - name: Install Ruby Dependencies
        run: bundle install

      - name: Generate YARD API Docs
        run: bundle exec yardoc --yardopts .yardopts

      - name: Normalize YARD Markdown Lists
        run: ruby scripts/normalize_yard_markdown.rb docs/api

      - uses: actions/upload-artifact@v4
        with:
          name: docs
          path: docs/api

  codex_publish:
    needs: build-docs-artifact
    uses: whittakertech/codex/.github/workflows/publish_docs.yml@master
    with:
      engine_owner: whittakertech
      engine_repo: midas
      engine_ref: ${{ github.sha }}
      docs_artifact_name: docs
      site_url: https://midas.whittakertech.com
    secrets:
      CODEX_GITHUB_TOKEN: ${{ secrets.CODEX_GITHUB_TOKEN }}
