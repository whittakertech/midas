name: Docs

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # Gitea-only internal preview (YARD + MkDocs -> Gitea's own gh-pages).
  # Documentation publishing of record moved to Codex (the `codex_publish`
  # job below), which owns midas.whittakertech.com via GitHub Pages.
  deploy-gitea-preview:
    if: github.server_url != 'https://github.com'
    runs-on: ubuntu-latest

    steps:
      - name: 🧩 Checkout Repository
        uses: actions/checkout@v4

      - name: 💎 Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: false

      - name: 🧱 Cache gem Dependencies
        uses: actions/cache@v4
        with:
          path: vendor/bundle
          key: ${{ runner.os }}-gems-${{ hashFiles('*.gemspec') }}
          restore-keys: |
            ${{ runner.os }}-gems-

      - name: 📦 Install Ruby Dependencies
        run: |
          bundle config set --local path vendor/bundle
          bundle install

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 🧱 Cache pip Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: 📦 Install Python Dependencies
        run: pip install -r requirements.txt

      - name: 📝 Generate YARD API Docs
        run: bundle exec yardoc --yardopts .yardopts

      - name: 🧹 Normalize YARD Markdown Lists
        run: ruby scripts/normalize_yard_markdown.rb docs/api

      - name: 🧪 Build MkDocs Site
        run: mkdocs build --strict

      - name: 🚀 Deploy to GitHub Pages
        run: mkdocs gh-deploy --force --clean --message "Deploy Midas Docs [skip ci]"

  # Real publish target: Codex ingests docs/ (hand-written pages +
  # this freshly-regenerated YARD output, overlaid into docs/api/) and
  # deploys straight to this repo's own gh-pages -- same domain
  # (midas.whittakertech.com), different tooling underneath.
  build-docs-artifact:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: false

      - name: Install Ruby Dependencies
        run: bundle install

      - name: Generate YARD API Docs
        run: bundle exec yardoc --yardopts .yardopts

      - name: Normalize YARD Markdown Lists
        run: ruby scripts/normalize_yard_markdown.rb docs/api

      - uses: actions/upload-artifact@v4
        with:
          name: docs
          path: docs/api

  codex_publish:
    needs: build-docs-artifact
    if: github.server_url == 'https://github.com'
    uses: whittakertech/codex/.github/workflows/publish_docs.yml@main
    with:
      engine_owner: whittakertech
      engine_repo: midas
      engine_ref: ${{ github.sha }}
      docs_artifact_name: docs
      site_url: https://midas.whittakertech.com
    secrets:
      CODEX_GITHUB_TOKEN: ${{ secrets.CODEX_GITHUB_TOKEN }}
